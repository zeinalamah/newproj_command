name: Paper 2 inspect Comext archive
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/inspect_comext_archive.py'
      - '.github/workflows/paper2-inspect-comext.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests py7zr
      - run: python paper2/inspect_comext_archive.py --year 2015 --out output/inspect_2015
      - if: always()
        run: cat output/inspect_2015/inspect.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-comext-inspect-2015
          path: output/inspect_2015
          retention-days: 7
          if-no-files-found: error
