name: Paper 2 PortWatch 2019-2026 build
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/paper2_baci/collect_portwatch_history.py'
      - '.github/workflows/paper2-portwatch-history.yml'
  push:
    branches: ['research/paper2-baci-20260724']
    paths:
      - 'research/paper2_baci/collect_portwatch_history.py'
      - '.github/workflows/paper2-portwatch-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests
      - name: Collect PortWatch daily chokepoints
        run: python research/paper2_baci/collect_portwatch_history.py
      - name: Show audit
        if: always()
        run: |
          cat research_output/portwatch/portwatch_summary.json || true
          cat research_output/portwatch/portwatch_coverage.csv || true
          find research_output/portwatch -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-portwatch-2019-2026
          path: research_output/portwatch
          retention-days: 7
          if-no-files-found: error
