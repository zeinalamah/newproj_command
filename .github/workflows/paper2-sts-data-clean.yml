name: Paper 2 Eurostat STS data
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/collect_eurostat_sts.py'
      - '.github/workflows/paper2-sts-data-clean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests
      - run: python paper2/collect_eurostat_sts.py
      - if: always()
        run: |
          cat output/eurostat_sts/eurostat_sts_build_summary.json || true
          cat output/eurostat_sts/eurostat_sts_coverage.csv || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-eurostat-sts-data
          path: output/eurostat_sts
          retention-days: 7
          if-no-files-found: error
