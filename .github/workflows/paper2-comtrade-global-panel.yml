name: Paper 2 global UN Comtrade export panel
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/collect_comtrade_global_exports.py'
      - '.github/workflows/paper2-comtrade-global-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests
      - run: python paper2/collect_comtrade_global_exports.py
      - if: always()
        run: |
          cat output/comtrade_global_exports/comtrade_global_export_summary.json || true
          tail -20 output/comtrade_global_exports/comtrade_global_export_request_audit.csv || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-global-un-comtrade-exports-2019-2026
          path: output/comtrade_global_exports
          retention-days: 7
          if-no-files-found: error
