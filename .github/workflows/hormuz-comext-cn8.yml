name: Hormuz Comext CN8 quality-control build
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/build_comext_cn8.py'
      - '.github/workflows/hormuz-comext-cn8.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests py7zr
      - run: python research/build_comext_cn8.py
      - if: always()
        run: |
          cat research_output/comext_cn8/summary.json || true
          head -40 research_output/comext_cn8/cn8_coverage.csv || true
          tail -20 research_output/comext_cn8/download_processing_log.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comext-cn8-main-products-2024-2026
          path: research_output/comext_cn8
          if-no-files-found: error
          retention-days: 7
