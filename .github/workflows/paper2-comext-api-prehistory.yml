name: Paper 2 Comext API prehistory 2021-2023
on:
  push:
    branches: ['research/paper2-baci-20260724']
    paths:
      - 'research/paper2_baci/collect_comext_api_prehistory.py'
      - '.github/workflows/paper2-comext-api-prehistory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests
      - run: python research/paper2_baci/collect_comext_api_prehistory.py
      - name: Show audit
        if: always()
        run: |
          cat research_output/comext_api_prehistory/summary.json || true
          cat research_output/comext_api_prehistory/coverage.csv || true
          find research_output/comext_api_prehistory -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-comext-api-2021-2023
          path: research_output/comext_api_prehistory
          retention-days: 7
          if-no-files-found: error
