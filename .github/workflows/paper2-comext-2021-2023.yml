name: Paper 2 Comext monthly prehistory 2021-2023
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/paper2_baci/collect_comext_annual_focal.py'
      - '.github/workflows/paper2-comext-2021-2023.yml'
  push:
    branches: ['research/paper2-baci-20260724']
    paths:
      - 'research/paper2_baci/collect_comext_annual_focal.py'
      - '.github/workflows/paper2-comext-2021-2023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        year: [2021, 2022, 2023]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests py7zr
      - run: python research/paper2_baci/collect_comext_annual_focal.py --year ${{ matrix.year }} --out-dir research_output/comext/${{ matrix.year }}
      - name: Show audit
        if: always()
        run: |
          cat research_output/comext/${{ matrix.year }}/audit_${{ matrix.year }}.json || true
          find research_output/comext/${{ matrix.year }} -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-comext-${{ matrix.year }}
          path: research_output/comext/${{ matrix.year }}
          retention-days: 7
          if-no-files-found: error
