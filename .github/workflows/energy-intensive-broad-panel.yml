name: Broad energy-intensive Comext panel 2015-2026

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/collect_energy_intensive_year.py'
      - 'paper2/combine_energy_intensive_years.py'
      - '.github/workflows/energy-intensive-broad-panel.yml'
  push:
    branches: ['research/energy-intensive-broad-build-20260724']
    paths:
      - 'paper2/collect_energy_intensive_year.py'
      - 'paper2/combine_energy_intensive_years.py'
      - '.github/workflows/energy-intensive-broad-panel.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        year: [2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests py7zr pyarrow
      - run: python paper2/collect_energy_intensive_year.py --year ${{ matrix.year }} --out-dir research_output/energy_intensive/year_${{ matrix.year }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-intensive-${{ matrix.year }}
          path: research_output/energy_intensive/year_${{ matrix.year }}
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy pyarrow
      - uses: actions/download-artifact@v4
        with:
          pattern: energy-intensive-*
          path: research_output/energy_intensive
          merge-multiple: false
      - name: Normalize artifact directories
        run: |
          for y in $(seq 2015 2026); do
            src="research_output/energy_intensive/energy-intensive-$y"
            dst="research_output/energy_intensive/year_$y"
            if [ -d "$src" ]; then mv "$src" "$dst"; fi
          done
      - run: python paper2/combine_energy_intensive_years.py
      - name: Print summary
        if: always()
        run: |
          cat research_output/energy_intensive/build_summary.json || true
          find research_output/energy_intensive -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-intensive-broad-panel-2015-2026
          path: |
            research_output/energy_intensive/energy_intensive_bilateral_2015_2026.parquet
            research_output/energy_intensive/energy_intensive_bilateral_2015_2026.csv.gz
            research_output/energy_intensive/importer_product_month_2015_2026.parquet
            research_output/energy_intensive/importer_product_month_2015_2026.csv.gz
            research_output/energy_intensive/prewar_exposure_2024_2025.csv
            research_output/energy_intensive/product_candidate_ranking.csv
            research_output/energy_intensive/family_candidate_ranking.csv
            research_output/energy_intensive/historical_mar_apr_placebos_2016_2025.csv.gz
            research_output/energy_intensive/energy_intensive_products_2015_2026.sqlite
            research_output/energy_intensive/build_summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish observable run ID
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Broad energy-intensive build run $GITHUB_RUN_ID" \
            --body "run_id=$GITHUB_RUN_ID; commit=$GITHUB_SHA; artifact=energy-intensive-broad-panel-2015-2026; conclusion=${{ job.status }}"
