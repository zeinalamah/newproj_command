name: PyFixest validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/test_pyfixest.py'
      - '.github/workflows/pyfixest-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy pyfixest
      - run: python paper2/test_pyfixest.py
      - if: always()
        run: cat output/pyfixest/result.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyfixest-validation
          path: output/pyfixest
          retention-days: 7
          if-no-files-found: error
