name: Isolated Comext API prehistory build
on:
  pull_request:
    branches: [main]
    paths:
      - 'collect_comext_api_prehistory.py'
      - '.github/workflows/comext-api-prehistory.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests
      - run: python collect_comext_api_prehistory.py
      - name: Show audit
        if: always()
        run: |
          cat research_output/summary.json || true
          cat research_output/coverage.csv || true
          find research_output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comext-api-prehistory-2021-2023
          path: research_output
          retention-days: 7
          if-no-files-found: error
