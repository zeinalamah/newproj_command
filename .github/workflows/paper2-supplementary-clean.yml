name: Paper 2 supplementary public data
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/collect_supplementary.py'
      - '.github/workflows/paper2-supplementary-clean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests openpyxl pyreadstat
      - run: python paper2/collect_supplementary.py
      - if: always()
        run: |
          cat output/supplementary/supplementary_build_audit.json || true
          find output/supplementary -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-supplementary-public-data-clean
          path: output/supplementary
          retention-days: 7
          if-no-files-found: error
