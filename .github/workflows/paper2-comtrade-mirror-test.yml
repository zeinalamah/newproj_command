name: Paper 2 UN Comtrade mirror test
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/test_comtrade_mirror.py'
      - '.github/workflows/paper2-comtrade-mirror-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests
      - run: python paper2/test_comtrade_mirror.py
      - if: always()
        run: cat output/comtrade_mirror_test/results.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-comtrade-mirror-test
          path: output/comtrade_mirror_test
          retention-days: 7
          if-no-files-found: error
