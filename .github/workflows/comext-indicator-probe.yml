name: Comext indicator probe
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/test_comext_indicators.py'
      - '.github/workflows/comext-indicator-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests
      - run: python research/test_comext_indicators.py
      - if: always()
        run: cat research_output/comext_indicator_probe/report.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comext-indicator-probe
          path: research_output/comext_indicator_probe
          if-no-files-found: error
          retention-days: 7
