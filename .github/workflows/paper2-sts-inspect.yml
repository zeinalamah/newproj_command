name: Paper 2 Eurostat STS inspect
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper2/inspect_eurostat_sts.py'
      - '.github/workflows/paper2-sts-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests
      - run: python paper2/inspect_eurostat_sts.py
      - if: always()
        run: cat output/sts_inspect/sts_dimension_report.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-eurostat-sts-metadata
          path: output/sts_inspect
          retention-days: 7
          if-no-files-found: error
