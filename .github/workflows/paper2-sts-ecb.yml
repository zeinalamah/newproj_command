name: Paper 2 Eurostat STS and ECB controls build
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/paper2_baci/collect_eurostat_sts_ecb.py'
      - '.github/workflows/paper2-sts-ecb.yml'
  push:
    branches: ['research/paper2-baci-20260724']
    paths:
      - 'research/paper2_baci/collect_eurostat_sts_ecb.py'
      - '.github/workflows/paper2-sts-ecb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests
      - name: Collect Eurostat STS and ECB exchange rate
        run: python research/paper2_baci/collect_eurostat_sts_ecb.py
      - name: Show audit
        if: always()
        run: |
          cat research_output/sts_ecb/sts_ecb_summary.json || true
          find research_output/sts_ecb -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-sts-ecb-controls
          path: research_output/sts_ecb
          retention-days: 7
          if-no-files-found: error
