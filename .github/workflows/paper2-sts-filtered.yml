name: Paper 2 filtered STS and ECB build
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/paper2_baci/collect_eurostat_sts_filtered.py'
      - '.github/workflows/paper2-sts-filtered.yml'
  push:
    branches: ['research/paper2-baci-20260724']
    paths:
      - 'research/paper2_baci/collect_eurostat_sts_filtered.py'
      - '.github/workflows/paper2-sts-filtered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas requests
      - run: python research/paper2_baci/collect_eurostat_sts_filtered.py
      - name: Show audit
        if: always()
        run: |
          cat research_output/sts_filtered/summary.json || true
          find research_output/sts_filtered -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper2-sts-filtered-controls
          path: research_output/sts_filtered
          retention-days: 7
          if-no-files-found: error
