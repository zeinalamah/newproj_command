name: Hormuz Eurostat STS outcomes build
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/build_eurostat_sts.py'
      - '.github/workflows/hormuz-eurostat-sts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests
      - run: python research/build_eurostat_sts.py
      - if: always()
        run: |
          cat research_output/eurostat_sts/summary.json || true
          cat research_output/eurostat_sts/industry_coverage_summary.csv || true
          tail -30 research_output/eurostat_sts/request_audit.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eurostat-sts-outcomes-2000-2026
          path: research_output/eurostat_sts
          if-no-files-found: error
          retention-days: 7
