name: Hormuz BACI global supplier build
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/build_baci_selected.py'
      - '.github/workflows/hormuz-baci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pandas numpy requests
      - name: Build selected BACI panel
        run: python research/build_baci_selected.py
      - if: always()
        run: |
          cat research_output/baci_selected/summary.json || true
          tail -10 research_output/baci_selected/member_audit.csv || true
          find research_output/baci_selected -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baci-selected-1995-2024
          path: research_output/baci_selected
          if-no-files-found: error
          retention-days: 7
